<?xml version="1.0" encoding="UTF-8"?>
<!--
Composed icons for Resenha rooms, following the pattern of core's
vendor/assets/svg-icons/discourse-additional.svg (e.g. discourse-bookmark-clock).
The base icon keeps its original viewBox so it renders at exactly the same size
as the plain icon; the lock badge overlaps its top-right corner, with a
transparent gap around the badge carved out of the base icon by a mask (a
fat-stroked copy of the lock silhouette). The masks must live inside the
symbols because SvgSprite only extracts <symbol> nodes from this file.
-->
