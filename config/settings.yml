plugins:
  resenha_enabled:
    default: false
    client: true
  resenha_allowed_groups:
    type: group_list
    list_type: compact
    default: "0"
    allow_any: false
    refresh: true
  resenha_create_room_allowed_groups:
    type: group_list
    list_type: compact
    default: "1|2|12"
    allow_any: false
    refresh: true
  resenha_direct_calls_allowed_groups:
    type: group_list
    list_type: compact
    default: ""
    allow_any: false
    refresh: true
  resenha_max_rooms_per_user:
    default: 5
  resenha_max_invites_per_day:
    default: 100
    min: 1
    max: 5000
  resenha_ephemeral_room_ttl_minutes:
    default: 30
    min: 5
    max: 10080
  resenha_participant_ttl_seconds:
    default: 30
  resenha_max_room_participants:
    default: 50
    min: 2
    max: 200
  resenha_stun_servers:
    default: "stun:stun.l.google.com:19302|stun:global.stun.twilio.com:3478"
  resenha_turn_servers:
    default: ""
  resenha_turn_username:
    default: ""
  resenha_turn_credential:
    default: ""
    secret: true
  resenha_turn_secret:
    default: ""
    secret: true
  resenha_turn_secret_servers:
    default: ""
    validator: "ResenhaTurnSecretServersValidator"
  resenha_livekit_url:
    default: ""
    validator: "ResenhaLivekitUrlValidator"
  resenha_livekit_api_key:
    default: ""
  resenha_livekit_api_secret:
    default: ""
    secret: true
  resenha_livekit_room_policy:
    default: "disabled"
    type: enum
    choices:
      - disabled
      - per_room
      - all_rooms
    validator: "ResenhaLivekitPolicyValidator"
  resenha_livekit_room_prefix:
    default: ""
  resenha_livekit_mesh_fallback:
    default: false
  resenha_livekit_recording_enabled:
    default: false
    client: true
  resenha_livekit_recording_filepath:
    default: "resenha/{room_name}-{utc}"
  resenha_video_enabled:
    default: true
    client: true
  resenha_video_max_publishers:
    default: 8
    min: 2
    max: 16
    client: true
  resenha_video_background_blur_enabled:
    default: true
    client: true
  resenha_subtitles_enabled:
    default: false
    client: true
  resenha_stt_model_base_url:
    default: ""
    client: true
  resenha_max_voice_quality:
    default: "maximum"
    type: enum
    client: true
    choices:
      - standard
      - high
      - maximum
  resenha_max_camera_quality:
    default: "maximum"
    type: enum
    client: true
    choices:
      - standard
      - high
      - maximum
  resenha_max_screen_share_quality:
    default: "maximum"
    type: enum
    client: true
    choices:
      - standard
      - high
      - maximum
  resenha_idle_threshold_minutes:
    default: 5
    min: 0
    max: 60
    client: true
  resenha_afk_auto_mute_threshold_minutes:
    default: 15
    min: 0
    max: 120
    client: true
  resenha_afk_disconnect_threshold_minutes:
    default: 30
    min: 0
    max: 240
    client: true
  resenha_auto_status_enabled:
    default: true
    client: true
  resenha_mesh_privacy_warning_enabled:
    default: true
    client: true
  resenha_badges_enabled:
    default: false
  resenha_analytics_enabled:
    default: true
  resenha_session_retention_days:
    default: 400
    min: 7
    max: 3650
  resenha_chat_enabled:
    default: true
    client: true
